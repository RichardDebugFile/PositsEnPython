name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  test:
    # La app es de escritorio Windows (pycaw, pywin32, winshell, win10toast),
    # por eso el runner debe ser Windows para que instalen las dependencias.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar sintaxis (compileall)
        run: python -m compileall -q src

      - name: Lint (pylint, informativo)
        continue-on-error: true
        run: pylint src --rcfile=.pylintrc

      - name: Seguridad (bandit, informativo)
        continue-on-error: true
        run: bandit -r src -ll

      - name: Tests (pytest)
        run: pytest
