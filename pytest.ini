[pytest]
# Tests automatizados (unitarios + integración/flujo).
# Los scripts de diagnóstico manual viven en tests/manual/ y se excluyen aquí
# porque requieren red, hardware de audio, modelos Vosk o un navegador con CDP.
testpaths = tests
addopts = -ra -q --ignore=tests/manual
python_files = test_*.py
python_classes = Test*
python_functions = test_*
